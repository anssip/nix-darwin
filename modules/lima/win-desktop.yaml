# Lima guest: headless Ubuntu + XFCE desktop reachable over RDP (port 3389).
#
# A Windows client connects with the built-in Remote Desktop Connection (mstsc)
# to the mini's tailnet name:3389. RDP is kept off the LAN and exposed only on
# the tailnet via `tailscale serve` (see home/remote-vm.nix for the one-time
# bootstrap notes).
#
# First-time creation (one-off):
#   limactl start --name=win-desktop modules/lima/win-desktop.yaml
# Thereafter the launchd agent (home/remote-vm.nix) runs `limactl start
# win-desktop` on login so the headless mini brings it back up after a reboot.

# Apple Virtualization.framework — native, fast, no QEMU needed on Apple Silicon.
vmType: "vz"
rosetta:
  enabled: false

cpus: 4
memory: "8GiB"
disk: "40GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# This is a self-contained desktop VM; no host filesystem sharing.
mounts: []

# Forward the guest's RDP port to the host loopback only. Tailnet exposure is
# handled separately by `tailscale serve`, so 3389 is never bound to the LAN.
portForwards:
  - guestPort: 3389
    hostIP: "127.0.0.1"
    hostPort: 3389

provision:
  # 1) Desktop + RDP server. Firefox is pulled from Mozilla's apt repo as a real
  #    .deb to avoid the snap-packaged Ubuntu build (slow/flaky in headless VMs).
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      install -d -m 0755 /etc/apt/keyrings
      apt-get update
      apt-get install -y wget gnupg
      wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg \
        -O /etc/apt/keyrings/packages.mozilla.org.asc
      echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" \
        > /etc/apt/sources.list.d/mozilla.list
      printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' \
        > /etc/apt/preferences.d/mozilla
      apt-get update
      apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11 firefox
      # Default new users into an XFCE session under xrdp.
      echo "xfce4-session" > /etc/skel/.xsession
      # Allow xrdp to read the TLS cert it generates.
      adduser xrdp ssl-cert || true
      systemctl enable --now xrdp

  # 2) Per-user session wiring + a login password so xrdp can authenticate.
  #    RDP is tailnet-only, but xrdp still requires a real password — CHANGE
  #    this from the placeholder before relying on it.
  - mode: user
    script: |
      #!/bin/bash
      set -eux
      echo "xfce4-session" > ~/.xsession
      echo "$(whoami):changeme" | sudo chpasswd
